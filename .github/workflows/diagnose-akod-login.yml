name: Diagnose A-kod login

on:
  workflow_dispatch:

jobs:
  diagnose-login-windows-ab:
    runs-on: windows-latest

    steps:
      - name: Compare correct and intentionally wrong login responses
        shell: powershell
        env:
          AKOD_LOGIN_URL: ${{ secrets.AKOD_LOGIN_URL }}
          AKOD_USERNAME: ${{ secrets.AKOD_USERNAME }}
          AKOD_PASSWORD: ${{ secrets.AKOD_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $loginUrl = $env:AKOD_LOGIN_URL
          $serviceUrl = [Uri]::new([Uri]$loginUrl, '/ServiceBooking.aspx').AbsoluteUri

          function Get-HiddenValue {
              param([string]$Html, [string]$Name)
              $escaped = [regex]::Escape($Name)
              $patterns = @(
                  "<input[^>]*name=[`"']$escaped[`"'][^>]*value=[`"']([^`"']*)[`"']",
                  "<input[^>]*value=[`"']([^`"']*)[`"'][^>]*name=[`"']$escaped[`"']"
              )
              foreach ($pattern in $patterns) {
                  $m = [regex]::Match($Html, $pattern, 'IgnoreCase')
                  if ($m.Success) {
                      return [System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value)
                  }
              }
              return ''
          }

          function Get-StringSha256 {
              param([string]$Value)
              $sha = [System.Security.Cryptography.SHA256]::Create()
              try {
                  $bytes = [System.Text.Encoding]::UTF8.GetBytes([string]$Value)
                  $hash = $sha.ComputeHash($bytes)
                  return ([BitConverter]::ToString($hash)).Replace('-', '').ToLowerInvariant()
              }
              finally {
                  $sha.Dispose()
              }
          }

          function Read-ErrorBody {
              param($Response)
              if (-not $Response) { return '' }
              try {
                  $stream = $Response.GetResponseStream()
                  if (-not $stream) { return '' }
                  $reader = New-Object System.IO.StreamReader($stream)
                  try { return $reader.ReadToEnd() }
                  finally { $reader.Dispose(); $stream.Dispose() }
              }
              catch { return '' }
          }

          function Invoke-LoginProbe {
              param(
                  [string]$Label,
                  [string]$Password
              )

              $loginPage = Invoke-WebRequest `
                  -Uri $loginUrl `
                  -UseBasicParsing `
                  -SessionVariable session `
                  -MaximumRedirection 5 `
                  -Headers @{ 'User-Agent' = 'Mozilla/5.0' }

              $viewState = Get-HiddenValue $loginPage.Content '__VIEWSTATE'
              $viewStateGenerator = Get-HiddenValue $loginPage.Content '__VIEWSTATEGENERATOR'
              $eventValidation = Get-HiddenValue $loginPage.Content '__EVENTVALIDATION'

              $form = @{
                  '__EVENTTARGET' = ''
                  '__EVENTARGUMENT' = ''
                  '__VIEWSTATE' = $viewState
                  '__VIEWSTATEGENERATOR' = $viewStateGenerator
                  '__EVENTVALIDATION' = $eventValidation
                  'ctl00$MainContent$txtUserName' = $env:AKOD_USERNAME
                  'ctl00$MainContent$txtPassword' = $Password
                  'ctl00$MainContent$btnLogin' = 'Login'
              }

              $postStatus = $null
              $postHtml = ''
              try {
                  $loginResult = Invoke-WebRequest `
                      -Uri $loginUrl `
                      -Method Post `
                      -WebSession $session `
                      -Body $form `
                      -ContentType 'application/x-www-form-urlencoded' `
                      -UseBasicParsing `
                      -MaximumRedirection 5 `
                      -Headers @{
                          'Origin' = ([Uri]$loginUrl).GetLeftPart([System.UriPartial]::Authority)
                          'Referer' = $loginUrl
                          'User-Agent' = 'Mozilla/5.0'
                      }
                  $postStatus = [int]$loginResult.StatusCode
                  $postHtml = [string]$loginResult.Content
              }
              catch {
                  if ($_.Exception.Response) {
                      try { $postStatus = [int]$_.Exception.Response.StatusCode } catch {}
                      $postHtml = Read-ErrorBody $_.Exception.Response
                  }
              }

              $serviceStatus = $null
              $serviceHtml = ''
              try {
                  $servicePage = Invoke-WebRequest `
                      -Uri $serviceUrl `
                      -WebSession $session `
                      -UseBasicParsing `
                      -MaximumRedirection 5 `
                      -Headers @{ 'User-Agent' = 'Mozilla/5.0' }
                  $serviceStatus = [int]$servicePage.StatusCode
                  $serviceHtml = [string]$servicePage.Content
              }
              catch {
                  if ($_.Exception.Response) {
                      try { $serviceStatus = [int]$_.Exception.Response.StatusCode } catch {}
                      $serviceHtml = Read-ErrorBody $_.Exception.Response
                  }
              }

              $cookieNames = @($session.Cookies.GetCookies([Uri]$loginUrl) | ForEach-Object Name | Sort-Object -Unique)

              return [pscustomobject]@{
                  Label = $Label
                  LoginGetStatus = [int]$loginPage.StatusCode
                  ViewStateLength = $viewState.Length
                  EventValidationLength = $eventValidation.Length
                  PostStatus = $postStatus
                  PostLength = $postHtml.Length
                  PostSha256 = Get-StringSha256 $postHtml
                  PostHasLoginForm = [bool]($postHtml -match 'MainContent_txtUserName')
                  PostHasWelcome = [bool]($postHtml -match 'Welcome')
                  ServiceStatus = $serviceStatus
                  ServiceLength = $serviceHtml.Length
                  ServiceSha256 = Get-StringSha256 $serviceHtml
                  ServiceHasLoginForm = [bool]($serviceHtml -match 'MainContent_txtUserName')
                  ServiceHasUnitInput = [bool]($serviceHtml -match 'MainContent_txtUnitID')
                  ServiceHasLogout = [bool]($serviceHtml -match 'Logout')
                  CookieNames = ($cookieNames -join ',')
              }
          }

          $correct = Invoke-LoginProbe -Label 'correct' -Password $env:AKOD_PASSWORD
          $wrong = Invoke-LoginProbe -Label 'wrong' -Password ($env:AKOD_PASSWORD + '__definitely_wrong__')

          foreach ($probe in @($correct, $wrong)) {
              Write-Host "ab_label=$($probe.Label)"
              Write-Host "ab_login_get_status=$($probe.LoginGetStatus)"
              Write-Host "ab_viewstate_len=$($probe.ViewStateLength)"
              Write-Host "ab_eventvalidation_len=$($probe.EventValidationLength)"
              Write-Host "ab_post_status=$($probe.PostStatus)"
              Write-Host "ab_post_len=$($probe.PostLength)"
              Write-Host "ab_post_sha256=$($probe.PostSha256)"
              Write-Host "ab_post_has_login_form=$($probe.PostHasLoginForm)"
              Write-Host "ab_post_has_welcome=$($probe.PostHasWelcome)"
              Write-Host "ab_service_status=$($probe.ServiceStatus)"
              Write-Host "ab_service_len=$($probe.ServiceLength)"
              Write-Host "ab_service_sha256=$($probe.ServiceSha256)"
              Write-Host "ab_service_has_login_form=$($probe.ServiceHasLoginForm)"
              Write-Host "ab_service_has_unit_input=$($probe.ServiceHasUnitInput)"
              Write-Host "ab_service_has_logout=$($probe.ServiceHasLogout)"
              Write-Host "ab_cookie_names=$($probe.CookieNames)"
          }

          Write-Host "ab_same_post_status=$($correct.PostStatus -eq $wrong.PostStatus)"
          Write-Host "ab_same_post_len=$($correct.PostLength -eq $wrong.PostLength)"
          Write-Host "ab_same_post_sha256=$($correct.PostSha256 -eq $wrong.PostSha256)"
          Write-Host "ab_same_service_sha256=$($correct.ServiceSha256 -eq $wrong.ServiceSha256)"

          if ($correct.ServiceHasUnitInput -and -not $correct.ServiceHasLoginForm) {
              Write-Host 'ab_correct_login_result=success'
          }
          else {
              Write-Host 'ab_correct_login_result=failure'
          }
